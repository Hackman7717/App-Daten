name: Stichprobe JSONL

# Einmalige Stichprobe des vollständigen Exports (Aufbau der Felder). Läuft nur bei Änderungen an diesen Dateien.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe.yml'
      - 'scripts/probe.py'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Kopf und Stichprobe
        run: |
          curl -sSIL https://static.openfoodfacts.org/data/openfoodfacts-products.jsonl.gz | grep -i -E "^(HTTP|content-length|last-modified)" | tee head.txt || true
          set +o pipefail
          curl -sSL https://static.openfoodfacts.org/data/openfoodfacts-products.jsonl.gz | gunzip -c 2>/dev/null | grep -F '"en:germany"' | head -n 3000 > sample.jsonl || true
          wc -l sample.jsonl
          mkdir -p report
          python3 scripts/probe.py sample.jsonl head.txt report/probe.json
      - name: Ablegen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/probe.json
          git commit -q -m "Stichprobe JSONL" || true
          git pull -q --rebase origin main
          git push -q origin HEAD:main
